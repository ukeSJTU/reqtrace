[package]
name = "reqtrace"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
pulldown-cmark = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
tree-sitter = "0.26"
tree-sitter-python = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-go = "0.25"
rayon = "1.8"
sha2 = "0.10"
anyhow = "1.0"
walkdir = "2.4"
regex = "1.10"
globset = "0.4.18"
